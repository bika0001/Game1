<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E3B4A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Solitaire Tides — le Solitaire classique, calme et lisible."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Solitaire Tides</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e3b4a;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      /* Mesure des marges de sécurité (encoches) lue par le moteur de mise en page. */
      #safe-area-probe {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e9d8a6;
        font:
          600 20px/1.4 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: 0.08em;
        transition: opacity 300ms ease;
      }
    </style>
  </head>
  <body>
    <div id="safe-area-probe"></div>
    <div id="boot-splash">Solitaire Tides</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
